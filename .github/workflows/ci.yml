name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
    - name: Lint
      run: pre-commit run --show-diff-on-failure --color=always --all-files
  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
        include:
          - os: ubuntu-latest
            python-version: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -e pytest-playwright
        pip install -e pytest-playwright-asyncio
        playwright install --with-deps
        if [ '${{ matrix.os }}' == 'macos-latest' ]; then
          playwright install msedge --with-deps
        fi
    - name: Test
      if: ${{ matrix.os != 'ubuntu-latest' }}
      run: pytest --cov=pytest_playwright --cov-report xml
    - name: Test on Linux
      if: ${{ matrix.os == 'ubuntu-latest' }}
      run: xvfb-run pytest --cov=pytest_playwright --cov-report xml
  test-without-base-url:
    # pytest-base-url is an optional extra; run the base-url tests without it installed.
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: 3.12
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r local-requirements.txt
        pip install -e pytest-playwright
        pip install -e pytest-playwright-asyncio
        pip uninstall -y pytest-base-url
        playwright install chromium --with-deps
    - name: Test
      run: xvfb-run pytest -k base_url
